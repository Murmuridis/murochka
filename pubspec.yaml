name: davlenie
description: "Мурочка — дневник давления и напоминания о лекарствах"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  sqflite: ^2.3.3
  path: ^1.9.0
  flutter_local_notifications: 17.2.4
  timezone: ^0.9.4
  path_provider: ^2.1.4
  file_picker: ^10.3.0
  share_plus: ^11.0.0
  pdf: ^3.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
